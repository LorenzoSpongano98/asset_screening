[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "backtest-engine"
requires-python = ">=3.13"
dynamic = ["version"]

[tool.maturin]
module-name = "backtest_engine"

[tool.uv]
# Without these, uv won't rebuild the package when the Rust sources change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "src/**/*.rs" },
]
